name: generate github metrics and contribution graphs

on:
    schedule: # Run automatically every 12 hours
        - cron: '0 */12 * * *'
    workflow_dispatch: # Allows manual triggering
    push: # Runs on every push to the main branch
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: generate contribution graph SVGs
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  # Comma-separated list of game names to generate. Default: pacman
                  games: 'pacman'

            - name: Generate Readme Stats
              uses: stats-organization/github-readme-stats-action@v2
              with:
                token: ${{ secrets.READ_ONLY_TOKEN }}
                card: stats
                options: username=satyvm&theme=github_dark&hide_title=true&show_icons=true&hide_border=true&include_all_commits=true&count_private=true
                path: dist/readme-stats.svg

            - name: Generate Streak Stats
              uses: DenverCoder1/github-readme-streak-stats@main
              with:
                token: ${{ secrets.READ_ONLY_TOKEN }}
                options: user=satyvm&theme=github-dark-blue&hide_border=true
                path: dist/streak-stats.svg

            # Push the generated SVGs to the output branch
            - name: push SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
